<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="vendeur.css">
    <title>Formulaire de vendeur</title>
</head>
<body>
    <header>
    <div class="header-container">
        <img src="../images/food.jpg " class="logo">
        <h1>INSCRIPTION DE VENDEURS </h1>
    </div>
    </header>
    <div class="petal">
        <form action="https://classroom.google.com/c/NzU5NjQ4NzA5MTcz" method="get">
            <h2>FORMULAIRE</h2><br>
            <hr>
            <p>Bienvenue sur notre inscription pour les vendeurs</p>
            <label for="name">Nom :</label>
            <input type="text" name="name" id="name" class="rosa" placeholder="Gorgolois"><br><br>
            <label for="prénom">Prénom :</label>
            <input type="text" name="prénom" id="prénom" class="rosa" placeholder="Julie"><br><br>
            <label for="email">Email :</label>   
            <input type="text" name="email" id="email" class="rosa" placeholder="*******************@gmail.com"><br><br>
            <label for="password">Mot de passe :</label>
            <input type="password" name="mot_de_passe" id="password" class="rosa" placeholder="Ema1234" ><br><br>
            <label for="confirm_password">Confirmer votre Mot de passe :</label>
            <input type="password" name="confirm_mot_de_passe" id="confirm_password" class="rosa" placeholder="Ema1234" ><br><br>
            <label for="Date">Date :</label>
            <input type="date" id="Date" class="rosa"><br><br>
            <label for="puce">N° téléphone :</label>
            <input type="text" name="name" id="Mvola" class="rosa" placeholder="Mvola"><br>
            <input type="text" name="name" id="OrangeMoney" class="rosa" placeholder="OrangeMoney"><br>
            <input type="text" name="name" id="AirtelMoney" class="rosa" placeholder="AirtelMoney"><br><br>
            <label for="genre">Genre :</label>
            <select name="genre" id="genre" class="rosa">
                <option >Homme</option>
                <option >Femme</option>
                <option >Transgenre</option>
            </select>

            <label for="Pays">Région:</label>
            <select name="pays" id="pays" class="rosa">
                <option >Tsirohimandidy</option>
                <option >Ampefy</option>
                <option >Sonerano Ivongo</option>
                <option >Marovoay</option>
                <option >Ambatolampy</option>
                <option >Ambatondrazaka</option>
                <option >Moramanga</option>
                <option >Ambohibary</option>
                <option >Sambaina</option>
                <option >Isalo</option>
                <option >Sambava</option>
                <option >Diego</option>
                <option >Foulpointe</option>
                <option >Toamasina</option>
                <option >Manakara</option>
                <option >Maevatanana</option>
                <option >Ambositra</option>
                <option >Fianarantsoa</option>
                <option >Fort-Dauphin</option>
                <option >Mahajanga</option>
                <option >Toliara</option>
                <option >Morondava</option>
                <option >Antsirabe</option>
                <option >Antananarivo</option>
            </select>
            <hr>
            <a href="../index.html" class="rosa">Enregistrer</a>

        </form>
    </div>

    <div class="paragraphe">
        <br>
        <hr><br>
        <p style="color: aliceblue;font-family: Verdana, Geneva, Tahoma, sans-serif;">Merci d'avoir enregistrer votre identification et nous vous souhaitant une belle vente.</p>
        <br>
    </div>
</body>
</html>
