<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="client.css">
    <title>Formulaire des clients </title>
</head>
<body>
    <header>
    <div class="header-container" >
        <img src="../images/food.jpg" class="logo">
        <h1>Inscription de CLIENTS</h1>
    </div>
    </header>
    <div class="petal">
        <form action="" method="">
            <h2>FORMULAIRE</h2><br>
            <hr>
            <p>Bienvenue sur notre inscription pour les clients</p>
            <label for="name">Nom :</label>
            <input type="text" name="name" id="name" class="rosa" placeholder="Gorgolois"><br><br>
            <label for="first">Prénom :</label>
            <input type="text" name="prénom" id="first" class="rosa" placeholder="Julie"><br><br>
            <label for="email">Email :</label>   
            <input type="text" name="email" id="mail" class="rosa" placeholder="*******************@gmail.com"><br><br>
            <label for="password">Mot de passe :</label>
            <input type="password" name="mot_de_passe" id="password" class="rosa" placeholder="Ema1234" ><br><br>
            <label for="confirme_mdp">Confirmer votre Mot de passe :</label>
            <input type="password" name="confirm_mot_de_passe" id="confirme_mdp" class="rosa" placeholder="Ema1234" ><br><br>
            <label for="plat"> Plat prefferer : </label>
            <input type="text" name="plat" id="plat" placeholder="Votre plat a commander ">
            <label for="puce">N° téléphone :</label>
            <input type="text" name="name" id="puce" class="rosa" placeholder="Mvola"><br>
            <input type="text" name="name" id="OrangeMoney" class="rosa" placeholder="OrangeMoney"><br>
            <input type="text" name="name" id="AirtelMoney" class="rosa" placeholder="AirtelMoney"><br><br>
            <label for="personne">Nombre de Personnes</label>
            <input type="number" id="personne" class="" placeholder="Nombre de personne" >
            <label for="Date">Date :</label>
            <input type="date" id="Date" class="rosa"><br><br>
            <label for="Pays">Région:</label>
            <select name="pays" id="Pays" class="rosa">
                <option >Tsirohimandidy</option>
                <option >Ampefy</option>
                <option >Sonerano Ivongo</option>
                <option >Marovoay</option>
                <option >Ambatolampy</option>
                <option >Ambatondrazaka</option>
                <option >Moramanga</option>
                <option >Ambohibary</option>
                <option >Sambaina</option>
                <option >Isalo</option>
                <option >Sambava</option>
                <option >Diego</option>
                <option >Foulpointe</option>
                <option >Toamasina</option>
                <option >Manakara</option>
                <option >Maevatanana</option>
                <option >Ambositra</option>
                <option >Fianarantsoa</option>
                <option >Fort-Dauphin</option>
                <option >Mahajanga</option>
                <option >Toliara</option>
                <option >Morondava</option>
                <option >Antsirabe</option>
                <option >Antananarivo</option>
            </select>
            <label for="message">Message : </label>
            <textarea name="massage" id="message" placeholder=" Votre message personnelle "></textarea>
            <hr>
            <a href="../index.html" class="botton">Enregistrer</a>
        </form>
    </div>

    <div class="paragraphe">
        <br>
        <hr><br>
        <p style="color: aliceblue;font-family: Verdana, Geneva, Tahoma, sans-serif;">Merci d'avoir enregistrer votre identifiant.</p>
    </div>
</body>
</html>
